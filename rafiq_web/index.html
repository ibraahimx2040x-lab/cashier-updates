<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d17">
  <title>رفيق · Rafiq</title>
  <meta name="description" content="دردش مع شخصيات خيالية أو اصنع شخصيتك الخاصة.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="main"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="portraits.js"></script>
  <script src="characters.js"></script>
  <script src="famous.js"></script>
  <script src="images/manifest.js"></script>
  <script>
    // Pictures in images/ (listed by images/manifest.js) replace the drawn portraits for every visitor.
    for (const c of [...(window.FAMOUS_CHARACTERS || []), ...(window.SEED_CHARACTERS || [])]) {
      const url = (window.CHARACTER_IMAGES || {})[c.id];
      if (url) c.avatar = { ...(c.avatar || {}), image: url };
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
