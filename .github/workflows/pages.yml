name: Web app (GitHub Pages)

# Publishes the Flutter web build, connected to the project's Supabase,
# at https://ibraahimx2040x-lab.github.io/cashier-updates/.
# The publishable key is safe to ship (every table is protected by RLS).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hayati_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter pub get
      - run: >
          flutter build web --release --no-web-resources-cdn
          --base-href /cashier-updates/
          --dart-define=SUPABASE_URL=https://ldptcpbqbgarypzplbwy.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_gxM3jE1D_xIAjgChGATTXg_HQp3knyD
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hayati_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
