name: Android app (APK)

# Builds an installable APK connected to the project's Supabase.
# Every run keeps the APK as a downloadable artifact; pushes to main also
# publish it on the "android-latest" release for a stable download link.
# Signed with the shared debug key (android/app/debug.keystore) so each
# build installs over the previous one. Not for the Play Store.

on:
  push:
    branches: [main, 'claude/**']
    paths: ['hayati_app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hayati_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=https://ldptcpbqbgarypzplbwy.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_gxM3jE1D_xIAjgChGATTXg_HQp3knyD
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/hayati.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hayati-apk
          path: hayati_app/build/hayati.apk
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: حياتي — نسخة أندرويد للتجربة
          body: |
            نزّل الملف hayati.apk على جوال أندرويد وثبّته (اسمح بالتثبيت من مصادر غير معروفة عند السؤال).
            آخر تحديث: ${{ github.sha }}
          prerelease: true
          files: hayati_app/build/hayati.apk
