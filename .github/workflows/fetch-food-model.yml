name: Fetch on-device food model (one-off)

# Downloads Google's AIY food classifier (TFLite, Apache-2.0) on a GitHub
# runner (the dev sandbox can't reach the model hosts) and commits it to
# this branch. Removed again once the model is in the repo.

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/fetch-food-model.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p hayati_app/assets/models /tmp/m && cd /tmp/m
          ok=
          for u in \
            "https://tfhub.dev/google/lite-model/aiy/vision/classifier/food_V1/1?lite-format=tflite" \
            "https://www.kaggle.com/api/v1/models/google/aiy/tfLite/vision-classifier-food-v1/1/download" \
            "https://storage.googleapis.com/tfhub-lite-models/google/lite-model/aiy/vision/classifier/food_V1/1.tflite"; do
            echo "== $u"
            if curl -fsSL --max-time 120 -o dl "$u"; then
              file dl; ls -l dl
              if file dl | grep -qi gzip; then tar xzf dl && ls -l; f=$(ls *.tflite | head -1); else f=dl; fi
              if [ -n "$f" ] && [ "$(stat -c %s "$f")" -gt 1000000 ]; then cp "$f" "$GITHUB_WORKSPACE/hayati_app/assets/models/food_v1.tflite"; ok=1; break; fi
            fi
          done
          test -n "$ok"
          cd "$GITHUB_WORKSPACE/hayati_app/assets/models"
          ls -l
          sha256sum food_v1.tflite
          # TFLite-with-metadata files are zips with the label map attached.
          unzip -l food_v1.tflite || true
          unzip -o food_v1.tflite -d labels_extracted || true
          ls -l labels_extracted || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hayati_app/assets/models
          git commit -m "Add Google AIY food classifier model (Apache-2.0) for on-device suggestions"
          git push
