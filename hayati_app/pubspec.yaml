name: hayati
description: "Hayati — personal life organizer: tasks, calendar, goals, habits, notes, expenses and a permission-bound assistant."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Brand assets are drawn by tool/make_brand.py.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#163A36"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#163A36"
    theme_color: "#163A36"

flutter_native_splash:
  color: "#163A36"
  image: assets/brand/splash.png
  android_12:
    color: "#163A36"
    image: assets/brand/splash.png
  web: true
